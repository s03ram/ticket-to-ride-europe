[project]
name = "ticket-to-ride-europe"
version = "0.1.0"
description = "A fun board game !"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.4.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "flake8>=6.1.0",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["src"]
